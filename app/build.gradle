plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mikeyphw.instaactions'
    compileSdk 36

    defaultConfig {
        applicationId 'com.mikeyphw.instaactions'
        minSdk 28
        targetSdk 36
        versionCode 4
        versionName '0.3.1-r1b-hf01'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            // Include modern libxposed metadata from src/main/resources at APK root.
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'org.luckypray:dexkit:2.0.3'
    // DexKit exposes Kotlin Function1/Unit in its Java-visible matchers.
    // DexKit's stdlib runtime dependency alone does not populate JavaCompile's compile classpath.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
    compileOnly 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
