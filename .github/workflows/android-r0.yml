name: R0 / R1 Android API 102
on:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/android-r0.yml'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
      - 'project.json'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ina-r0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Android CI contract before SDK setup
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'  # The removed legacy SDK 'tools' package must not be requested.
      - name: Install Android platform 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic  # Compatible with private repositories without proprietary caching.
          gradle-version: '8.13'
      - name: JVM tests, Android debug APK and instrumentation APK
        run: |
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify actual APK metadata and Xposed contract
        run: |
          python3 tools/verify_r0_apk.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --test-apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Verify R1 native DexKit packaging
        run: |
          python3 tools/verify_r1_apk.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --test-apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
      - name: Verify R1B read-only context packaging
        run: |
          python3 tools/verify_r1b_apk.py \
            --apk app/build/outputs/apk/debug/app-debug.apk
      - name: SHA-256 provenance
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/InstaActions-r1b-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk dist/InstaActions-r0-androidTest.apk
          (cd dist && sha256sum *.apk > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Upload debug APK and instrumented test APK
        uses: actions/upload-artifact@v4
        with:
          name: InstaActions-R1B-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
